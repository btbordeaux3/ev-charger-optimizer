# EV Charger Optimizer V2 — Durham + Orange Counties, NC
name: "Durham-Orange NC"

counties:
  - name: "Durham"
    state_fips: "37"
    county_fips: "063"
    state_abbr: NC
  - name: "Orange"
    state_fips: "37"
    county_fips: "135"
    state_abbr: NC

nrel_api_key: ""
census_api_key: ""
cache_dir: "data/raw"
road_network_source: "osmnx"
municipal_layers: []

min_parking_m2: 1000
min_parking_capacity: 20
candidate_tile_deg: 0.10
walk_network_buffer_m: 2500
drive_network_buffer_m: 8000

demand:
  grid_resolution_m: 400
  alpha_traffic: 1.0
  beta_equity: 1.0
  income_weighted_equity: false
  traffic_influence_m: 600

coverage:
  l2_walk_time_min: 10
  dcfc_drive_time_min: 10
  walk_speed_kph: 4.8
  drive_default_speed_kph: 35.0
  dcfc_min_aadt: 0.0
  direction: "to_site"
  map_thresholds_min: [5, 10, 15]
  routing_backend: "auto"
  routing_workers: 0
  routing_chunk_size: 24

optimization:
  min_l2: 2
  min_dcfc: 3
  min_sites_used: 6
  max_sites_used: 0
  min_site_spacing_m: 0
  coverage_bonus: 0.25
  k_sites: 6
  gamma: 0.5
  solver: "auto"
  time_limit_s: 180
  mip_gap: 0.01

budget:
  budget: 1500000
  cost_l2: 50000
  cost_dcfc: 150000
  cap_l2: 15
  cap_dcfc: 60
  site_max: 6
  parking_spaces_per_charger: 10
  parking_m2_per_space: 30
  min_site_max: 1

existing:
  covered_demand_multiplier: 0.35
  public_only: true

zoning:
  layers: []
  multifamily_column: ""
  multifamily_values: []
  cell_multiplier: 1.5

grid:
  enabled: false
  layers: []
  capacity_column: ""
  charger_power_kw: {l2: 7.2, dcfc: 150.0}
  simultaneity: 1.0
  margin: 0.85
  max_iterations: 5

output:
  out_dir: "data/output"
  map_path: "ev_charger_map.html"
  results_path: "recommended_sites.csv"
  coverage_path: "coverage_summary.csv"
  charts_dir: "data/output/charts"
